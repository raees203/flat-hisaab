<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat Hisaab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="wrap">
  <header class="top" id="topbar">
    <h1 id="flatName">Flat Hisaab<span class="sub" id="meLine"></span></h1>
    <button class="iconbtn" data-act="open-approvals" aria-label="Payments to approve" id="bell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="bellBadge" hidden></span>
    </button>
    <button class="iconbtn" data-act="open-settings" aria-label="Settings and members" id="gear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="loading">Starting…</div></main>
</div>

<nav class="tabs" aria-label="Sections" id="tabs">
  <div class="in">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h12a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2z"/><path d="M7 8h7M7 12h7M7 16h4"/></svg>Balances<span class="dot" id="tabDot" hidden></span></button>
    <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M5 13h14M12 3v3"/></svg>Today</button>
    <button class="fab" data-act="add-expense" aria-label="Add an expense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>History</button>
    <button class="tab" data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Report</button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
/*__LOGIC__*/
</script>
<script>
(function () {
"use strict";

// ---------- helpers ----------
var MEALS = [{ k: "nashta", label: "Breakfast" }, { k: "lunch", label: "Lunch" }, { k: "dinner", label: "Dinner" }];
var MEAL_LABEL = { nashta: "Breakfast", lunch: "Lunch", dinner: "Dinner", other: "Other" };
var METHODS = ["Cash", "JazzCash", "Easypaisa", "Bank"];
var TABS = ["home", "today", "history", "report"];
var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
var MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
var CFG = window.HISAAB_CONFIG || {};
var Cap = (window.Capacitor && window.Capacitor.Plugins) || {};

function pad(n) { return (n < 10 ? "0" : "") + n; }
function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today() { return dstr(new Date()); }
function parseD(s) { var p = String(s || today()).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function shiftDay(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function fmtDate(s) { var d = parseD(s); return DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()]; }
function fmtMonth(m) { var p = m.split("-"); return MONTHS_FULL[+p[1] - 1] + " " + p[0]; }
function shiftMonth(m, n) { var p = m.split("-"); var d = new Date(+p[0], +p[1] - 1 + n, 1); return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
function rs(n) { return "Rs " + Math.abs(Math.round(n)).toLocaleString("en-US"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function initials(n) { n = (n || "?").trim(); return esc(n.charAt(0).toUpperCase() || "?"); }
function people(n) { return n + (n === 1 ? " person" : " people"); }
function $(id) { return document.getElementById(id); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
}

// ---------- state ----------
var SB = null;
var S = {
  view: "boot", uid: null, offline: !navigator.onLine, bootError: "",
  flatId: lsGet("hisaab.flat"), flat: null, myFlats: [],
  members: [], expenses: [], payments: [], att: {}, attDate: today(), loaded: false,
  tab: "home", month: today().slice(0, 7), hf: "all", hm: "", sheet: null, onboard: null
};
var channel = null;
var seenPending = {};
try { seenPending = JSON.parse(lsGet("hisaab.seen") || "{}") || {}; } catch (e) { seenPending = {}; }

function active() { return S.members.filter(function (m) { return m.active !== false; }); }
function memberIds() { return S.members.map(function (m) { return m.id; }); }
function member(id) { for (var i = 0; i < S.members.length; i++) if (S.members[i].id === id) return S.members[i]; return null; }
function nameOf(id) { var m = member(id); return m ? (m.name || "Member") : "Former member"; }
function myId() { for (var i = 0; i < S.members.length; i++) if (S.members[i].uid && S.members[i].uid === S.uid) return S.members[i].id; return null; }
function meValid() { return !!myId(); }
function isOwner() { return !!(S.flat && S.uid && S.flat.owner_id === S.uid); }
function takenByOther(m) { return !!(m && m.uid && m.uid !== S.uid); }
function sortEntries(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); }
function balances() { return computeBalances(memberIds(), S.expenses, S.payments); }
function pairs() { return pairwiseDebts(S.expenses, S.payments); }
function eating(att, date, meal, mid) { var d = att[date + "_" + mid]; return d ? d[meal] !== false : true; }
function findById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function flatName() { return (S.flat && S.flat.name) || "Flat"; }

function canApprove(p) { return !!p && p.status === "pending" && meValid() && p.to === myId(); }
function myApprovals() { return S.payments.filter(canApprove).sort(sortEntries); }
function canDeleteExpense(e) { return isOwner() || e.createdByUid === S.uid || (meValid() && e.paidBy === myId()); }
function canDeletePayment(p) { return isOwner() || (p.status !== "approved" && (p.createdByUid === S.uid || (meValid() && p.from === myId()))); }

// ---------- toast ----------
var toastT = null;
function toast(msg) {
  var t = $("toast"); t.textContent = msg; t.className = "on";
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ""; }, 3200);
}
function errText(e) {
  var m = (e && (e.message || e.error_description || e.msg)) || "";
  if (!navigator.onLine || /fetch|network|Failed to|timeout/i.test(m)) return "Couldn't reach the server. Check your internet and try again.";
  if (/row-level security/i.test(m)) return "You're not allowed to do that in this flat.";
  return m || "Something went wrong. Try again.";
}
function fail(e) { toast(errText(e)); }

// ---------- row mapping ----------
function mapMember(r) { return { id: r.id, name: r.name, uid: r.user_id, active: r.active, createdAt: Date.parse(r.created_at) }; }
function mapExpense(r) {
  return { id: r.id, amount: r.amount, paidBy: r.paid_by, date: r.date, meal: r.meal, note: r.note, shares: r.shares || {},
    receipt: !!r.receipt_path, receiptPath: r.receipt_path, createdAt: Date.parse(r.created_at), by: r.created_by_member, createdByUid: r.created_by };
}
function mapPayment(r) {
  return { id: r.id, from: r.from_member, to: r.to_member, amount: r.amount, method: r.method, date: r.date, status: r.status,
    receipt: !!r.receipt_path, receiptPath: r.receipt_path, createdAt: Date.parse(r.created_at), by: r.created_by_member, createdByUid: r.created_by };
}

// ---------- data loading ----------
function fetchAll(table, order) {
  var out = [], size = 1000;
  function page(from) {
    return SB.from(table).select("*").eq("flat_id", S.flatId).order(order, { ascending: true }).order("id").range(from, from + size - 1)
      .then(function (r) {
        if (r.error) throw r.error;
        out = out.concat(r.data);
        return r.data.length === size ? page(from + size) : out;
      });
  }
  return page(0);
}
var loaders = {
  flat: function () {
    return SB.from("flats").select("*").eq("id", S.flatId).maybeSingle().then(function (r) { if (r.error) throw r.error; S.flat = r.data; });
  },
  members: function () { return fetchAll("members", "created_at").then(function (rows) { S.members = rows.map(mapMember); }); },
  expenses: function () { return fetchAll("expenses", "created_at").then(function (rows) { S.expenses = rows.map(mapExpense).sort(sortEntries); }); },
  payments: function () { return fetchAll("payments", "created_at").then(function (rows) { S.payments = rows.map(mapPayment).sort(sortEntries); notifyNewPending(); }); },
  attendance: function () {
    var date = S.attDate;
    return SB.from("attendance").select("*").eq("flat_id", S.flatId).eq("date", date).then(function (r) {
      if (r.error) throw r.error;
      if (date !== S.attDate) return;
      var m = {}; r.data.forEach(function (a) { m[a.date + "_" + a.member_id] = a; }); S.att = m;
    });
  }
};
var pending = {}, timers = {};
function refresh(table) {
  clearTimeout(timers[table]);
  timers[table] = setTimeout(function () {
    if (!S.flatId || pending[table]) return;
    pending[table] = true;
    loaders[table]().then(function () {
      pending[table] = false;
      if (table === "flat" && !S.flat) { leaveToOnboarding("You're no longer part of that flat."); return; }
      renderAll();
      if (S.sheet && S.sheet.type !== "expense" && S.sheet.type !== "payment" && S.sheet.type !== "copy") renderSheet();
    }).catch(function (e) { pending[table] = false; if (!navigator.onLine) { S.offline = true; renderBanner(); } else console.warn(table, e); });
  }, 250);
}
function loadEverything() {
  S.loaded = false; renderAll();
  return loaders.flat().then(function () {
    if (!S.flat) { leaveToOnboarding("That flat isn't available any more. Join again with its code."); return; }
    return Promise.all([loaders.members(), loaders.expenses(), loaders.payments(), loaders.attendance()]).then(function () {
      S.loaded = true; S.offline = false; renderAll();
    });
  }).catch(function (e) {
    S.offline = !navigator.onLine; S.loadError = errText(e); renderAll();
  });
}
function subscribe() {
  if (channel) { SB.removeChannel(channel); channel = null; }
  var f = "flat_id=eq." + S.flatId;
  channel = SB.channel("flat-" + S.flatId)
    .on("postgres_changes", { event: "*", schema: "public", table: "expenses", filter: f }, function () { refresh("expenses"); })
    .on("postgres_changes", { event: "*", schema: "public", table: "payments", filter: f }, function () { refresh("payments"); })
    .on("postgres_changes", { event: "*", schema: "public", table: "members", filter: f }, function () { refresh("members"); })
    .on("postgres_changes", { event: "*", schema: "public", table: "attendance", filter: f }, function () { refresh("attendance"); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "flats", filter: "id=eq." + S.flatId }, function () { refresh("flat"); })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "expenses" }, function () { refresh("expenses"); })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "payments" }, function () { refresh("payments"); })
    .subscribe();
}
function openFlat(id) {
  S.flatId = id; lsSet("hisaab.flat", id);
  S.flat = null; S.members = []; S.expenses = []; S.payments = []; S.att = {}; S.attDate = today();
  S.view = "app"; S.tab = "home"; closeSheet();
  loadEverything().then(function () { if (S.view === "app" && S.flat) { subscribe(); askNotifyPermission(); } });
}
function leaveToOnboarding(msg) {
  if (channel) { SB.removeChannel(channel); channel = null; }
  S.flatId = null; lsSet("hisaab.flat", null); S.flat = null; S.view = "onboard"; closeSheet();
  loadMyFlats(); renderAll();
  if (msg) toast(msg);
}
function loadMyFlats() {
  return SB.from("flats").select("id,name,code").order("created_at").then(function (r) {
    if (!r.error) { S.myFlats = r.data || []; if (S.view === "onboard") renderMain(); }
  });
}

// ---------- notifications ----------
function askNotifyPermission() {
  if (!Cap.LocalNotifications || lsGet("hisaab.notifyAsked")) return;
  lsSet("hisaab.notifyAsked", "1");
  Cap.LocalNotifications.requestPermissions().catch(function () {});
}
function notifyNewPending() {
  var me = myId(); if (!me) return;
  var fresh = S.payments.filter(function (p) { return p.status === "pending" && p.to === me && !seenPending[p.id]; });
  if (!fresh.length) return;
  fresh.forEach(function (p) { seenPending[p.id] = 1; });
  lsSet("hisaab.seen", JSON.stringify(seenPending));
  var p = fresh[0];
  var body = fresh.length === 1 ? nameOf(p.from) + " says he paid you " + rs(p.amount) + ". Tap to approve." : fresh.length + " payments are waiting for your approval.";
  toast(body);
  if (Cap.LocalNotifications && document.visibilityState !== "visible") {
    Cap.LocalNotifications.schedule({ notifications: [{ id: Math.floor(Math.random() * 2000000000), title: "Payment to approve", body: body }] }).catch(function () {});
  }
}

// ---------- screenshots ----------
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var maxSide = 1400, q = 0.75;
      var attempt = function (k) {
        var sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * sc));
        c.height = Math.max(1, Math.round(img.naturalHeight * sc));
        var x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          if (!blob) { URL.revokeObjectURL(url); reject(new Error("decode")); return; }
          if (blob.size > 450000 && k < 8) { if (q > 0.5) q -= 0.1; else maxSide = Math.round(maxSide * 0.8); attempt(k + 1); return; }
          URL.revokeObjectURL(url);
          if (blob.size > 1000000) { reject(new Error("big")); return; }
          resolve({ blob: blob, preview: c.toDataURL("image/jpeg", 0.5) });
        }, "image/jpeg", q);
      };
      attempt(0);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}
function uploadReceipt(blob) {
  if (!blob) return Promise.resolve(null);
  var path = S.flatId + "/" + uuid() + ".jpg";
  return SB.storage.from("receipts").upload(path, blob, { contentType: "image/jpeg", upsert: false }).then(function (r) {
    if (r.error) throw r.error; return path;
  });
}

// ---------- sharing ----------
function shareText(text) {
  if (Cap.Share) return Cap.Share.share({ text: text, dialogTitle: "Share" }).catch(function () {});
  if (navigator.share) return navigator.share({ text: text }).catch(function () {});
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
function duesText() {
  var t = pairs();
  var lines = ["*" + flatName() + " balances* (" + fmtDate(today()) + ")", ""];
  if (!t.length) lines.push("Everyone is settled up.");
  else { lines.push("Who owes whom:"); t.forEach(function (x) { lines.push("• " + nameOf(x.from) + " → " + nameOf(x.to) + ": " + rs(x.amount)); }); }
  return lines.join("\n");
}
function remindText(from, amount) {
  return "Hi " + nameOf(from) + ", as per Flat Hisaab you owe me " + rs(amount) + " for " + flatName() + " expenses. Please pay when you can.";
}
function inviteText() {
  return "Join *" + flatName() + "* on Flat Hisaab to split our food costs.\n\nOpen the app → Join a flat → enter code: *" + (S.flat ? S.flat.code : "") + "*";
}
function reportText(m) {
  var R = monthData(m), t = pairs();
  var lines = ["*" + flatName() + " report: " + fmtMonth(m) + "*", "", "Total spent: " + rs(R.total), "Meals: " + R.meals, "", "Paid vs share this month:"];
  R.rows.forEach(function (r) { lines.push("• " + r.name + ": paid " + rs(r.paid) + ", share " + rs(r.share)); });
  lines.push("", t.length ? "Who owes whom (all time):" : "Everyone is settled up.");
  t.forEach(function (x) { lines.push("• " + nameOf(x.from) + " → " + nameOf(x.to) + ": " + rs(x.amount)); });
  return lines.join("\n");
}
function copyText(text) {
  try { navigator.clipboard.writeText(text).then(function () { toast("Copied"); }, function () { openSheet({ type: "copy", text: text }); }); }
  catch (e) { openSheet({ type: "copy", text: text }); }
}

// ---------- month data ----------
function monthData(m) {
  var ex = S.expenses.filter(function (e) { return (e.date || "").slice(0, 7) === m; });
  var pay = S.payments.filter(function (p) { return (p.date || "").slice(0, 7) === m; });
  var tot = memberTotals(memberIds(), ex, pay);
  var total = ex.reduce(function (a, e) { return a + (Number(e.amount) || 0); }, 0);
  var mealSet = {};
  ex.forEach(function (e) { if (e.meal && e.meal !== "other") mealSet[e.date + e.meal] = 1; });
  var rows = S.members.filter(function (mm) { var t = tot[mm.id]; return mm.active !== false || (t && (t.paid || t.share)); })
    .map(function (mm) { var t = tot[mm.id] || { paid: 0, share: 0 }; return { id: mm.id, name: mm.name, paid: t.paid, share: t.share }; });
  return { ex: ex, pay: pay, total: total, meals: Object.keys(mealSet).length, rows: rows };
}

// ---------- rendering ----------
function balPill(v) {
  v = Math.round(v);
  if (v > 0) return '<span class="pill good num">Gets ' + rs(v) + "</span>";
  if (v < 0) return '<span class="pill bad num">Owes ' + rs(v) + "</span>";
  return '<span class="pill even">Settled</span>';
}
function statusPill(p) {
  if (p.status === "pending") return ' <span class="pill pending">Pending</span>';
  if (p.status === "rejected") return ' <span class="pill rejected">Rejected</span>';
  return "";
}
function renderHeader() {
  var inApp = S.view === "app" && S.loaded;
  $("topbar").style.display = S.view === "app" ? "" : "none";
  $("tabs").style.display = inApp ? "" : "none";
  $("flatName").firstChild.nodeValue = S.flat ? S.flat.name : "Flat Hisaab";
  $("meLine").textContent = meValid() ? "You: " + nameOf(myId()) : "";
  var n = inApp ? myApprovals().length : 0;
  $("bellBadge").hidden = !n; $("bellBadge").textContent = n; $("tabDot").hidden = !n;
  $("bell").style.display = inApp ? "" : "none";
}
function renderBanner() {
  var b = "";
  if (S.offline) b = '<div class="banner warn">You\'re offline. Showing the last data; changes need internet.</div>';
  else if (S.view === "app" && S.loaded && S.members.length && !meValid()) {
    b = '<div class="banner"><div style="font-weight:700;margin-bottom:8px">Which one are you? Tap your name once; it links to this phone.</div><div class="chips">' +
      active().map(function (m) {
        var taken = takenByOther(m);
        return '<button class="chip plain" aria-pressed="false" data-act="set-me" data-id="' + esc(m.id) + '"' + (taken ? " disabled" : "") + ">" + esc(m.name) + (taken ? " (linked)" : "") + "</button>";
      }).join("") + '</div><div style="margin-top:12px;font-weight:600;font-size:.88rem">Not in the list? Add yourself:</div>' +
      '<div class="row" style="border:0;padding:6px 0 0"><input class="input" id="self-name" maxlength="30" placeholder="Your name" aria-label="Your name"><button class="btn sm primary" data-act="add-self">Add me</button></div></div>';
  }
  $("banner").innerHTML = b;
}
function renderNav() {
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute("data-tab") === S.tab) tabs[i].setAttribute("aria-current", "page");
    else tabs[i].removeAttribute("aria-current");
  }
}

// ---------- sheets ----------
function openSheet(s) { S.sheet = s; renderSheet(); }
function closeSheet() { S.sheet = null; $("sheetRoot").innerHTML = ""; }
function sheetWrap(title, body) {
  return '<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-h"><h2>' + esc(title) +
    '</h2><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>' + body + "</div></div>";
}
function memberOptions(sel, list) {
  return (list || active()).map(function (m) { return '<option value="' + esc(m.id) + '"' + (m.id === sel ? " selected" : "") + ">" + esc(m.name) + "</option>"; }).join("");
}
function renderSheet() {
  var s = S.sheet, root = $("sheetRoot");
  if (!s) { root.innerHTML = ""; return; }
  var html = "";
  if (s.type === "expense") html = sheetWrap("New expense", expenseForm(s));
  else if (s.type === "payment") html = sheetWrap("Record a payment", paymentForm(s));
  else if (s.type === "member") html = sheetWrap(nameOf(s.id), memberDetail(s.id));
  else if (s.type === "exp-detail") html = sheetWrap("Expense", expenseDetail(s));
  else if (s.type === "pay-detail") html = sheetWrap("Payment", paymentDetail(s));
  else if (s.type === "list") html = sheetWrap(s.v === "receive" ? "You will receive" : "You have to pay", listBody(s.v));
  else if (s.type === "approvals") html = sheetWrap("Payments to approve", approvalsSheet());
  else if (s.type === "settings") html = sheetWrap("Settings", settingsBody());
  else if (s.type === "image") html = sheetWrap("Report image", '<p class="muted small">Long-press the image to save or share it.</p><img class="receipt-img" src="' + s.src + '" alt="Report">');
  else if (s.type === "copy") html = sheetWrap("Copy", '<p class="muted small">Select the text and copy it.</p><textarea class="input copybox" id="copybox" readonly>' + esc(s.text) + "</textarea>");
  root.innerHTML = html;
  if (s.type === "copy") { var cb = $("copybox"); cb.focus(); cb.select(); }
  if (s.type === "expense") updatePreview();
  if (s.type === "payment") updatePayNote();
  if (s.focus && $(s.focus)) { $(s.focus).focus(); s.focus = null; }
}

  if (!list.length) return '<div class="empty">' + (v === "receive" ? "Nobody owes you anything." : "You don't owe anyone.") + "</div>";
  return '<div class="stack"><div class="card"><div class="rows">' + list.map(function (x) {
    var other = v === "receive" ? x.from : x.to;

      ? '<button class="btn sm" data-act="remind" data-id="' + esc(x.from) + '" data-amt="' + x.amount + '">Remind</button><button class="btn sm" data-act="add-payment" data-from="' + esc(x.from) + '" data-to="' + esc(me) + '" data-amt="' + x.amount + '">Got it</button>'

  }).join("") + '</div><div class="netline" style="border-top:1px solid var(--line);padding-top:10px"><b>Total</b><b class="num ' + (v === "receive" ? "good-t" : "bad-t") + '">' + rs(total) + "</b></div></div>" +
    '<p class="muted small" style="margin:0">' + (v === "receive"

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act],[data-tab]");
  if (!el) return;
  var tab = el.getAttribute("data-tab");
  if (tab && !el.hasAttribute("data-act")) { closeSheet(); setTab(tab); return; }
  var a = el.getAttribute("data-act"), id = el.getAttribute("data-id"), s = S.sheet;
  switch (a) {
    case "overlay": if (ev.target === el) closeSheet(); break;
    case "close": closeSheet(); break;
    case "retry-boot": boot(); break;
    case "reload": S.loadError = ""; loadEverything(); break;
    case "open-flat": openFlat(id); break;
    case "ob-create-open": readOnboard(); S.onboard.mode = "create"; renderMain(); break;
    case "ob-join": {
      readOnboard();
      var code = (S.onboard.code || "").trim().toUpperCase(), cerr = $("ob-code-err");
      if (!/^[A-Z0-9]{6}$/.test(code)) { cerr.textContent = "The code has 6 letters/numbers."; break; }
      el.disabled = true; el.textContent = "Joining…";
      SB.rpc("join_flat", { p_code: code }).then(function (r) {
        if (r.error) throw r.error;
        S.onboard = null; openFlat(r.data);
      }).catch(function (e) { el.disabled = false; el.textContent = "Join flat"; cerr.textContent = /No flat/.test(e.message || "") ? "No flat has that code. Check it and try again." : errText(e); });
      break;
    }
    case "su-more": readOnboard(); S.onboard.members.push(""); renderMain(); break;
    case "su-save": createFlat(el); break;
    case "set-me": setMe(id); break;
    case "add-self": {
      var sn = $("self-name").value.trim().slice(0, 30);
      if (!sn) { toast("Type your name first."); break; }
      if (S.members.some(function (m) { return (m.name || "").trim().toLowerCase() === sn.toLowerCase(); })) { toast(sn + " is already in the list. Tap that name instead."); break; }
      SB.from("members").insert({ flat_id: S.flatId, name: sn, user_id: S.uid }).then(function (r) {
        if (r.error) throw r.error; return loaders.members();
      }).then(function () { renderAll(); toast("Welcome, " + sn + "!"); }).catch(fail);
      break;
    }
    case "open-settings": openSheet({ type: "settings" }); break;
    case "open-approvals": openSheet({ type: "approvals" }); break;
    case "open-list": openSheet({ type: "list", v: el.getAttribute("data-v") }); break;
    case "open-member": openSheet({ type: "member", id: id }); break;
    case "open-expense": openSheet({ type: "exp-detail", id: id }); break;
    case "open-payment": openSheet({ type: "pay-detail", id: id }); break;
    case "approve": decide(id, "approved"); break;
    case "reject": decide(id, "rejected"); break;
    case "share-dues": shareText(duesText()); break;
    case "copy-dues": copyText(duesText()); break;
    case "share-report": shareText(reportText(S.month)); break;
    case "copy-report": copyText(reportText(S.month)); break;
    case "share-report-img": shareReportImage(); break;
    case "share-invite": shareText(inviteText()); break;
    case "remind": shareText(remindText(id, +el.getAttribute("data-amt"))); break;
    case "day": S.attDate = shiftDay(S.attDate, +el.getAttribute("data-n")); S.att = {}; renderMain(); refresh("attendance"); break;
    case "day-today": S.attDate = today(); S.att = {}; renderMain(); refresh("attendance"); break;
    case "month": S.month = shiftMonth(S.month, +el.getAttribute("data-n")); renderMain(); break;
    case "hf": S.hf = el.getAttribute("data-v"); renderMain(); break;
    case "toggle-eat": toggleEat(el.getAttribute("data-meal"), id); break;
    case "add-expense": {
      if (S.view !== "app" || !S.loaded || !active().length) break;
      var me = myId();
      var payer = me && member(me).active !== false ? me : active()[0].id;
      openSheet({ type: "expense", amount: "", paidBy: payer, date: el.getAttribute("data-date") || today(), meal: el.getAttribute("data-meal") || defaultMeal(),
        note: "", parts: active().map(function (m) { return m.id; }), img: null, focus: "ex-amt" });
      prefillParts(); break;
    }
    case "ex-meal": readExpenseInputs(); s.meal = el.getAttribute("data-v"); renderSheet(); prefillParts(); break;
    case "ex-part":
      readExpenseInputs();
      if (s.parts.indexOf(id) >= 0) s.parts = s.parts.filter(function (x) { return x !== id; }); else s.parts = s.parts.concat([id]);
      refreshParts(); break;
    case "ex-all": readExpenseInputs(); s.parts = active().map(function (m) { return m.id; }); refreshParts(); break;
    case "ex-att": readExpenseInputs(); prefillParts(); break;
    case "ex-save": saveExpense(); break;
    case "add-payment": {
      if (!S.members.length) break;
      var my = myId();
      var from = el.getAttribute("data-from") || my || active()[0].id;
      var to = el.getAttribute("data-to");
      var pr = pairs();
      if (!to) { var t1 = pr.filter(function (x) { return x.from === from; })[0]; to = t1 ? t1.to : (S.members.filter(function (m) { return m.id !== from; })[0] || {}).id; }
      var amt = el.getAttribute("data-amt");
      if (!amt) { var t2 = pr.filter(function (x) { return x.from === from && x.to === to; })[0]; amt = t2 ? String(t2.amount) : ""; }
      openSheet({ type: "payment", from: from, to: to, amount: amt, method: "JazzCash", date: today(), img: null, focus: "py-amt" }); break;
    }
    case "py-method": readPaymentInputs(); s.method = el.getAttribute("data-v"); renderSheet(); break;
    case "py-save": savePayment(); break;
    case "shot-clear": if (s.type === "expense") readExpenseInputs(); else readPaymentInputs(); s.img = null; renderSheet(); break;
    case "load-receipt": {
      var item = findById(s.type === "exp-detail" ? S.expenses : S.payments, s.id);
      if (!item || !item.receiptPath) break;
      s.imgLoading = true; renderSheet();
      SB.storage.from("receipts").createSignedUrl(item.receiptPath, 3600).then(function (r) {
        if (S.sheet !== s) return;
        s.imgLoading = false;
        if (r.error || !r.data) s.imgMissing = true; else s.img = r.data.signedUrl;
        renderSheet();
      }).catch(function () { s.imgLoading = false; s.imgMissing = true; renderSheet(); });
      break;
    }
    case "del-ask": s.confirm = true; renderSheet(); break;
    case "del-no": s.confirm = false; renderSheet(); break;
    case "del-yes": {
      var table = s.type === "exp-detail" ? "expenses" : "payments";
      var it = findById(table === "expenses" ? S.expenses : S.payments, s.id);
      SB.from(table).delete().eq("id", s.id).select("id").then(function (r) {
        if (r.error) throw r.error;
        if (!r.data || !r.data.length) throw new Error("You're not allowed to delete this one.");
        if (it && it.receiptPath) SB.storage.from("receipts").remove([it.receiptPath]).catch(function () {});
        closeSheet(); toast("Deleted"); refresh(table);
      }).catch(fail);
      break;
    }
    case "st-name-save": {
      var nm = $("st-name").value.trim().slice(0, 40);
      if (!nm) { toast("The name can't be empty."); break; }
      SB.from("flats").update({ name: nm }).eq("id", S.flatId).then(function (r) { if (r.error) throw r.error; toast("Name saved"); refresh("flat"); }).catch(fail); break;
    }
    case "mem-rename": {
      var v = $("mn-" + id).value.trim().slice(0, 30);
      if (!v) { toast("The name can't be empty."); break; }
      SB.from("members").update({ name: v }).eq("id", id).then(function (r) { if (r.error) throw r.error; toast("Name updated"); refresh("members"); }).catch(fail); break;
    }
    case "mem-off": SB.from("members").update({ active: false }).eq("id", id).then(function (r) { if (r.error) throw r.error; toast(nameOf(id) + " removed from new splits"); refresh("members"); }).catch(fail); break;
    case "mem-on": SB.from("members").update({ active: true }).eq("id", id).then(function (r) { if (r.error) throw r.error; refresh("members"); }).catch(fail); break;
    case "mem-unlink": SB.rpc("unlink_member", { p_member: id }).then(function (r) { if (r.error) throw r.error; toast("Phone unlinked"); refresh("members"); }).catch(fail); break;
    case "mem-add": {
      var nn = $("mem-new").value.trim().slice(0, 30);
      if (!nn) { toast("Type a name first."); break; }
      SB.from("members").insert({ flat_id: S.flatId, name: nn }).then(function (r) { if (r.error) throw r.error; toast(nn + " added"); refresh("members"); }).catch(fail); break;
    }
    case "switch-flat": leaveToOnboarding(); break;
  }
});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.id === "ex-amt") updatePreview();
  if (t.id === "py-amt") readPaymentInputs();
  if (t.id === "ob-code") { t.value = t.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (S.onboard) S.onboard.code = t.value; }
  if (t.hasAttribute && t.hasAttribute("data-su")) readOnboard();
});
document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t.id === "ex-by") updatePreview();
  if (t.id === "ex-date") { readExpenseInputs(); prefillParts(); }
  if (t.id === "py-from" || t.id === "py-to") updatePayNote();
  if (t.id === "hm") { S.hm = t.value; renderMain(); }
  if (t.id === "st-me") setMe(t.value);
  if (t.id === "su-me") readOnboard();
  if (t.id === "shot-in" && t.files && t.files[0]) {
    var s = S.sheet; if (!s) return;
    if (s.type === "expense") readExpenseInputs(); else readPaymentInputs();
    s.imgBusy = true; renderSheet();
    compressImage(t.files[0]).then(function (img) {
      s.imgBusy = false; s.img = img; if (S.sheet === s) renderSheet();
    }).catch(function (e) {
      s.imgBusy = false; if (S.sheet === s) renderSheet();
      toast(e && e.message === "big" ? "That screenshot is too large. Crop it and try again." : "Couldn't open that image. Use a JPG or PNG screenshot.");
    });
  }
});
document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && S.sheet) closeSheet(); });

// ---------- onboarding ----------
function readOnboard() {
  var o = S.onboard; if (!o) return;
  if ($("ob-code")) o.code = $("ob-code").value;
  if ($("su-name")) o.name = $("su-name").value;
  o.members = o.members.map(function (n, i) { return $("su-m" + i) ? $("su-m" + i).value : n; });
  var sel = $("su-me");
  if (sel) { o.me = +sel.value; for (var i = 0; i < o.members.length; i++) if (sel.options[i]) sel.options[i].textContent = o.members[i] || "Name " + (i + 1); }
}
function createFlat(btn) {
  readOnboard();
  var o = S.onboard, err = $("su-err");
  var names = [], meIndex = 0;
  o.members.forEach(function (n, i) { n = n.trim().slice(0, 30); if (n) { names.push(n); if (i === o.me) meIndex = names.length; } });
  if (names.length < 2) { err.textContent = "Add at least 2 members."; return; }
  if (!meIndex) { err.textContent = "Pick your own name in \"Which one are you?\""; return; }
  var lower = names.map(function (n) { return n.toLowerCase(); });
  if (lower.some(function (n, i) { return lower.indexOf(n) !== i; })) { err.textContent = "Two members have the same name. Make them different."; return; }
  btn.disabled = true; btn.textContent = "Creating…";
  SB.rpc("create_flat", { p_name: (o.name || "").trim() || "Flat", p_members: names, p_me: meIndex }).then(function (r) {
    if (r.error) throw r.error;
    S.onboard = null; openFlat(r.data); toast("Flat created. Share the code from Settings.");
  }).catch(function (e) { btn.disabled = false; btn.textContent = "Create flat"; err.textContent = errText(e); });
}

// ---------- report image ----------
function drawReport() {
  var m = S.month, R = monthData(m), t = pairs();
  var W = 1080, P = 64, rowH = 64;
  var H = 420 + R.rows.length * rowH + 110 + Math.max(1, t.length) * 54 + 120;
  var c = document.createElement("canvas"); c.width = W; c.height = H;
  var x = c.getContext("2d");
  var disp = "Bricolage Grotesque, sans-serif", body = "Figtree, sans-serif";
  var accent = "#3a44c9", ink = "#161a2e", muted = "#5b6178", line = "#dde0ea";
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  x.fillStyle = accent; x.fillRect(0, 0, W, 14);
  x.fillStyle = muted; x.font = "600 30px " + body; x.fillText(flatName() + " report", P, 92);
  x.fillStyle = ink; x.font = "800 64px " + disp; x.fillText(fmtMonth(m), P, 168);
  x.fillStyle = muted; x.font = "600 26px " + body; x.fillText("Total spent", P, 238); x.fillText("Meals", P + 420, 238); x.fillText("Expenses", P + 680, 238);
  x.fillStyle = ink; x.font = "800 52px " + disp; x.fillText(rs(R.total), P, 298); x.fillText(String(R.meals), P + 420, 298); x.fillText(String(R.ex.length), P + 680, 298);
  var y = 380;
  x.fillStyle = ink; x.font = "700 32px " + disp; x.fillText("Who spent how much", P, y);
  y += 30;
  var max = Math.max.apply(null, R.rows.map(function (r) { return r.paid; }).concat([1]));
  var barX = P + 200, barW = W - barX - P - 170;
  R.rows.forEach(function (r) {
    x.fillStyle = ink; x.font = "600 28px " + body;
    x.fillText(r.name.length > 12 ? r.name.slice(0, 11) + "…" : r.name, P, y + 38);
    x.fillStyle = "#eef0f5"; x.fillRect(barX, y + 12, barW, 36);
    x.fillStyle = accent; x.fillRect(barX, y + 12, Math.max(4, barW * r.paid / max), 36);
    x.fillStyle = ink; x.font = "700 28px " + body; x.textAlign = "right"; x.fillText(rs(r.paid), W - P, y + 40); x.textAlign = "left";
    y += rowH;
  });
  y += 40; x.strokeStyle = line; x.lineWidth = 2; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
  y += 60; x.fillStyle = ink; x.font = "700 32px " + disp; x.fillText(t.length ? "Who owes whom" : "Everyone is settled up", P, y);
  y += 20;
  t.forEach(function (d) {
    y += 54; x.fillStyle = ink; x.font = "600 30px " + body; x.fillText(nameOf(d.from) + "  →  " + nameOf(d.to), P, y);
    x.fillStyle = "#c3352b"; x.font = "700 30px " + body; x.textAlign = "right"; x.fillText(rs(d.amount), W - P, y); x.textAlign = "left";
  });
  x.fillStyle = muted; x.font = "500 22px " + body; x.fillText("Made with Flat Hisaab on " + fmtDate(today()), P, H - 44);
  return c;
}

// ---------- boot ----------
function boot() {
  S.view = "boot"; S.bootError = ""; renderAll();
  if (!window.supabase || !CFG.url || !CFG.anonKey) { S.bootError = "The app isn't configured yet."; renderAll(); return; }
  if (!SB) SB = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "hisaab-auth" } });
  SB.auth.getSession().then(function (r) {
    if (r.data && r.data.session) return r.data.session;
    return SB.auth.signInAnonymously().then(function (a) { if (a.error) throw a.error; return a.data.session; });
  }).then(function (session) {
    S.uid = session.user.id;
    if (S.flatId) { S.view = "app"; openFlat(S.flatId); }
    else { S.view = "onboard"; renderAll(); loadMyFlats(); }
  }).catch(function (e) {
    S.bootError = navigator.onLine ? "Couldn't sign in: " + errText(e) : "No internet connection. Connect and try again.";
    renderAll();
  });
}
window.addEventListener("online", function () { S.offline = false; renderBanner(); if (S.view === "boot") boot(); else if (S.flatId) { ["flat", "members", "expenses", "payments", "attendance"].forEach(refresh); } });
window.addEventListener("offline", function () { S.offline = true; renderBanner(); });
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && S.view === "app" && S.flatId && SB) ["members", "expenses", "payments", "attendance"].forEach(refresh);
});
if (Cap.App) {
  Cap.App.addListener("backButton", function () {
    if (S.sheet) closeSheet();
    else if (S.view === "app" && S.tab !== "home") setTab("home");
    else Cap.App.exitApp();
  });
}
if (Cap.LocalNotifications) {
  Cap.LocalNotifications.addListener("localNotificationActionPerformed", function () { if (S.view === "app") { closeSheet(); setTab("home"); } });
}
window.__hisaab = { S: S, refresh: refresh };
boot();
})();
</script>
